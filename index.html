<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editpro - भविष्य का एडिटर</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .app-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 200px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 15px;
            color: #fff;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: 0.3s;
        }
        textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }
        .btn-group {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        button {
            background: linear-gradient(to right, #2563eb, #4f46e5);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4);
        }
        .clear-btn {
            background: transparent;
            border: 1px solid #475569;
            color: #cbd5e1;
        }
        .clear-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Editpro AI</h1>
        <p>आपका अदृश्य डिजिटल दोस्त, आपके टेक्स्ट को स्मार्ट बनाने के लिए तैयार है।</p>
        
        <textarea id="editor" placeholder="यहाँ कुछ भी लिखना शुरू करें..."></textarea>
        
        <div class="btn-group">
            <button onclick="upperCaseText()">बड़े अक्षरों में बदलें</button>
            <button class="clear-btn" onclick="clearText()">साफ़ करें</button>
        </div>
    </div>

    <script>
        function upperCaseText() {
            let text = document.getElementById("editor").value;
            document.getElementById("editor").value = text.toUpperCase();
        }

        function clearText() {
            document.getElementById("editor").value = "";
        }
    </script>
</body>
</html>
